name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run it makes obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/theo
      - name: Acceptance report (UC-01 to UC-08)
        # Shows what ran and what was skipped on this system, and why: the
        # skips are the platform limits that are still unverified.
        shell: bash
        run: |
          go test -count=1 -v ./internal/acceptance 2>&1 | grep -E '^\s*(---|[a-z_]+_test.go:[0-9]+:)'

  race:
    # The same tests under the race detector, on Linux only: it makes them
    # several times slower and the data races it finds do not depend on the
    # system. A separate job so the matrix above stays as fast as it was.
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  coverage:
    # How much of the code the tests run, reported and never enforced: there is
    # no threshold, nothing here can fail a pull request except the tests
    # themselves. The numbers are in the run's summary and the profile is
    # attached to the run.
    name: Coverage report (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests with a coverage profile
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Report
        run: scripts/coverage-summary.sh coverage.out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  smoke:
    # The whole examples/demo walk-through (scripts/smoke.sh) against the
    # runner's real Docker daemon: about 100 checks, from project add to
    # project remove --delete-worktrees, then no container or volume left.
    # The same sequence then runs as scripts/smoke.ps1 under PowerShell 7
    # (preinstalled on the runner); Windows PowerShell 5.1 is not covered.
    name: Smoke (demo, real Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o theo-bin ./cmd/theo
      - run: docker version && docker compose version
      - name: scripts/smoke.sh
        # Keep the demo's images so the PowerShell run below reuses them.
        env:
          THEO_SMOKE_KEEP_IMAGES: "1"
        run: scripts/smoke.sh ./theo-bin
      - name: scripts/smoke.ps1 (PowerShell 7)
        shell: pwsh
        run: ./scripts/smoke.ps1 -Theo ./theo-bin

  web:
    name: Web interface (build is up to date)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: internal/ui/dist matches web/ (rebuild with npm run build and commit)
        working-directory: .
        run: test -z "$(git status --porcelain -- internal/ui/dist)"

  e2e-real:
    name: Web e2e against the real server (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: docker version && docker compose version
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: cd web && npm run build
      - name: Real e2e (real theo serve, Docker)
        working-directory: web
        run: npm run test:e2e:real
      - name: Screenshots of the flows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: web/e2e/screenshots/
          if-no-files-found: ignore

  desktop:
    # The desktop app is a separate binary behind the "desktop" build tag; the
    # jobs above never build it. Linux also runs the tests that need a display
    # and the smoke test under a virtual one. macOS and Windows only compile it:
    # nothing opens a window there (see docs/cli/desktop.md).
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install WebKitGTK and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev xvfb openbox wmctrl curl
          # webview_go asks for webkit2gtk-4.0; newer Ubuntu only has 4.1.
          echo "PKG_CONFIG_PATH=$(scripts/webkit40-shim.sh):${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - name: Windows icon resource
        if: runner.os == 'Windows'
        shell: bash
        run: go run github.com/akavel/rsrc@v0.10.2 -ico web/public/brand/avatar-plum.ico -arch amd64 -o cmd/theo-desktop/rsrc_windows_amd64.syso
      - run: go vet -tags desktop ./cmd/theo-desktop ./internal/desktop
      - name: Build theo-desktop
        shell: bash
        run: go build -tags desktop -trimpath -o theo-desktop-bin ./cmd/theo-desktop
      - name: Tests compile (no window on this system)
        if: runner.os != 'Linux'
        run: go test -tags desktop -count=1 -run '^$' ./internal/desktop
      - name: Tests, including the real web view
        if: runner.os == 'Linux'
        run: xvfb-run -a go test -tags desktop -count=1 -v ./internal/desktop
      - name: Smoke test (window, session, server reuse, shutdown)
        if: runner.os == 'Linux'
        run: xvfb-run -a scripts/desktop-smoke.sh ./theo-desktop-bin
