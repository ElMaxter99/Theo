name: CodeQL

# GitHub's static analysis (security queries) for the Go code, the web
# interface (TypeScript) and the workflow files themselves. Results show up in
# the repository's Security tab ("Code scanning").
#
# If "Default setup" for code scanning is switched on in the repository
# settings (Settings > Advanced Security), turn it off: GitHub refuses
# results from a workflow while the default setup is active.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because new queries arrive without any change to the code.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: go, build-mode: autobuild }
          - { language: javascript-typescript, build-mode: none }
          - { language: actions, build-mode: none }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
