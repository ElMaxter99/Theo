name: Release

# Pushing a tag such as v0.1.0 tests Theo, builds it for every supported
# system and publishes a GitHub release with the archives and checksums.txt.
#
# A pull request that touches this workflow or the packaging scripts, or a
# manual run (workflow_dispatch), is a dry run: it builds and packages
# everything under the tag v0.0.0-dryrun and uploads the result as workflow
# artifacts, but publishes nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-desktop.sh
      - scripts/package-manifests.sh
      - packaging/**
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.5.0), for a release whose tag push failed or has no assets. Empty = dry run."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.0-dryrun' }}
        run: |
          set -euo pipefail
          bin=theo
          [ "$GOOS" = windows ] && bin=theo.exe
          name="theo_${TAG}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath \
            -ldflags "-s -w -X github.com/ElMaxter99/Theo/internal/engine.Version=${TAG}" \
            -o "dist/$name/$bin" ./cmd/theo
          cp LICENSE README.md README.es.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: theo_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  desktop:
    # Native builds of the desktop app (it needs cgo and the system web view, so
    # it cannot be cross-compiled from the Linux runner like the CLI).
    name: Desktop (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          # Built on the arm64 runner with clang -arch x86_64; never run in CI.
          - { os: macos-latest, goos: darwin, goarch: amd64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    env:
      CGO_ENABLED: "1"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.0-dryrun' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install WebKitGTK
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          echo "PKG_CONFIG_PATH=$(scripts/webkit40-shim.sh):${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - name: Windows icon resource
        if: matrix.goos == 'windows'
        shell: bash
        run: go run github.com/akavel/rsrc@v0.10.2 -ico web/public/brand/avatar-plum.ico -arch amd64 -o cmd/theo-desktop/rsrc_windows_amd64.syso
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          flags="-s -w -X github.com/ElMaxter99/Theo/internal/engine.Version=${TAG}"
          [ "$GOOS" = windows ] && flags="$flags -H=windowsgui"
          go build -tags desktop -trimpath -ldflags "$flags" -o theo-desktop-bin ./cmd/theo-desktop
      - name: Package
        shell: bash
        run: scripts/package-desktop.sh "$GOOS" "$GOARCH" "$TAG" theo-desktop-bin
      - uses: actions/upload-artifact@v4
        with:
          name: theo_desktop_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  dry-run:
    name: Assemble release (dry run, nothing published)
    if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.tag == '' }}
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and manifests
        shell: bash
        env:
          TAG: v0.0.0-dryrun
        run: |
          set -euo pipefail
          cd assets
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt
          # 6 CLI archives and 4 desktop archives.
          test "$(wc -l < checksums.txt)" -eq 10
          bash ../scripts/package-manifests.sh "$TAG" checksums.txt manifests
          python3 -m json.tool manifests/theo.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: assets

  release:
    name: Publish release
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.0-dryrun' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd assets
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt
          bash ../scripts/package-manifests.sh "$TAG" checksums.txt manifests
          files=(*.tar.gz *.zip checksums.txt manifests/theo.json manifests/theo.rb)
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            # The release was already made (by hand, or by an earlier run): keep its
            # notes and put the files in it, replacing any with the same name.
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$REPO" --title "Theo $TAG" --generate-notes \
              --verify-tag "${files[@]}"
          fi
