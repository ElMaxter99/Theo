name: Release

# Versions are vX.Y.Z (digits only) and release candidates are vX.Y.Z-rc.N.
# Nobody has to create a tag by hand:
#
#   1. Push a branch named release/X.Y.Z. Every push to it tests Theo, builds
#      it for every supported system and publishes the next pre-release,
#      vX.Y.Z-rc.1, -rc.2... (the archives and checksums.txt, no Scoop or
#      Homebrew files, never "latest"). A re-run of the same commit reuses its
#      tag.
#   2. Merge the pull request release/X.Y.Z -> main. release-on-merge.yml tags
#      the merge commit vX.Y.Z and calls this workflow, which publishes the
#      release: the same archives plus the Scoop and Homebrew files, with the
#      "## vX.Y.Z" section of CHANGELOG.md as notes (missing = the run fails).
#
# Pushing a tag vX.Y.Z or vX.Y.Z-rc.N by hand still works, and so does a manual
# run with a tag (to redo a release whose files are missing). Any other tag or
# branch version fails before building anything. A pull request that touches
# this workflow or the packaging scripts, or a manual run with no tag, is a dry
# run: it builds everything as v0.0.0-dryrun and publishes nothing.
# See CONTRIBUTING.md, "Releasing".
on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-on-merge.yml
      - scripts/package-desktop.sh
      - scripts/package-manifests.sh
      - packaging/**
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build and publish (release-on-merge.yml creates it first)."
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.5.0), for a release whose tag push failed or has no assets. Empty = dry run."
        required: false
        default: ""

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/release/') }}

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      target: ${{ steps.v.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Resolve the version
        id: v
        shell: bash
        env:
          TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          BRANCH: ${{ startsWith(github.ref, 'refs/heads/release/') && github.ref_name || '' }}
          # Only a manual run may publish without the changelog section.
          LAX: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          out() { printf 'tag=%s\npublish=%s\nprerelease=%s\ntarget=%s\n' "$1" "$2" "$3" "$4" >> "$GITHUB_OUTPUT"; }
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
          if [ -n "$BRANCH" ]; then
            # release/X.Y.Z: the next release candidate, tagged by the release step.
            ver="${BRANCH#release/}"
            if ! [[ "v$ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Branch '$BRANCH' is not release/X.Y.Z (digits only)."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$ver" > /dev/null; then
              echo "::error::v$ver already exists; start a new release/ branch with the next version."
              exit 1
            fi
            existing=$(git tag --points-at HEAD --list "v$ver-rc.*" | head -n 1)
            if [ -n "$existing" ]; then
              n=${existing##*-rc.}
              echo "This commit is already v$ver-rc.$n."
              out "$existing" true true ""
            else
              last=$(git tag --list "v$ver-rc.*" | sed 's/.*-rc\.//' | sort -n | tail -n 1)
              n=$(( ${last:-0} + 1 ))
              out "v$ver-rc.$n" true true "$GITHUB_SHA"
            fi
            exit 0
          fi
          if [ -z "$TAG" ]; then
            echo "Dry run: nothing will be published."
            out v0.0.0-dryrun false false ""
            exit 0
          fi
          if ! [[ "$TAG" =~ $re ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-rc.N (digits only)."
            exit 1
          fi
          pre=false
          [[ "$TAG" == *-rc.* ]] && pre=true
          if [ "$pre" = false ]; then
            # A release is cut from main, with its changelog section written.
            if [ "$LAX" = false ] && ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::$TAG is not on main. Merge the release first, or use a release candidate (${TAG}-rc.1)."
              exit 1
            fi
            if ! grep -qE "^## ${TAG}( |$)" CHANGELOG.md; then
              msg="CHANGELOG.md has no '## ${TAG}' section."
              if [ "$LAX" = false ]; then echo "::error::$msg"; exit 1; fi
              echo "::warning::$msg"
            fi
          fi
          out "$TAG" true "$pre" ""

  test:
    needs: prepare
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          bin=theo
          [ "$GOOS" = windows ] && bin=theo.exe
          name="theo_${TAG}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath \
            -ldflags "-s -w -X github.com/ElMaxter99/Theo/internal/engine.Version=${TAG}" \
            -o "dist/$name/$bin" ./cmd/theo
          cp LICENSE README.md README.es.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: theo_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  desktop:
    # Native builds of the desktop app (it needs cgo and the system web view, so
    # it cannot be cross-compiled from the Linux runner like the CLI).
    name: Desktop (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [prepare, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          # Built on the arm64 runner with clang -arch x86_64; never run in CI.
          - { os: macos-latest, goos: darwin, goarch: amd64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    env:
      CGO_ENABLED: "1"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install WebKitGTK
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          echo "PKG_CONFIG_PATH=$(scripts/webkit40-shim.sh):${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - name: Windows icon resource
        if: matrix.goos == 'windows'
        shell: bash
        run: go run github.com/akavel/rsrc@v0.10.2 -ico web/public/brand/avatar-plum.ico -arch amd64 -o cmd/theo-desktop/rsrc_windows_amd64.syso
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          flags="-s -w -X github.com/ElMaxter99/Theo/internal/engine.Version=${TAG}"
          [ "$GOOS" = windows ] && flags="$flags -H=windowsgui"
          go build -tags desktop -trimpath -ldflags "$flags" -o theo-desktop-bin ./cmd/theo-desktop
      - name: Package
        shell: bash
        run: scripts/package-desktop.sh "$GOOS" "$GOARCH" "$TAG" theo-desktop-bin
      - uses: actions/upload-artifact@v4
        with:
          name: theo_desktop_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  dry-run:
    name: Assemble release (dry run, nothing published)
    if: ${{ needs.prepare.outputs.publish != 'true' }}
    needs: [prepare, build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and manifests
        shell: bash
        env:
          TAG: v0.0.0-dryrun
        run: |
          set -euo pipefail
          cd assets
          sha256sum -- *.tar.gz *.zip > checksums.txt
          cat checksums.txt
          # 6 CLI archives and 4 desktop archives.
          test "$(wc -l < checksums.txt)" -eq 10
          bash ../scripts/package-manifests.sh "$TAG" checksums.txt manifests
          python3 -m json.tool manifests/theo.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: assets

  release:
    name: Publish release
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    needs: [prepare, build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TARGET: ${{ needs.prepare.outputs.target }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd assets
          sha256sum -- *.tar.gz *.zip > checksums.txt
          cat checksums.txt
          files=(*.tar.gz *.zip checksums.txt)
          if [ "$PRERELEASE" = false ]; then
            bash ../scripts/package-manifests.sh "$TAG" checksums.txt manifests
            files+=(manifests/theo.json manifests/theo.rb)
          fi
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            # The release was already made (by hand, or by an earlier run): keep its
            # notes and put the files in it, replacing any with the same name.
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
          else
            # Notes: the CHANGELOG.md section of the version (a release candidate
            # uses the one of the release it prepares); GitHub's list otherwise.
            base="${TAG%%-rc.*}"
            awk -v h="## $base" '
              $0 == h || index($0, h " ") == 1 { on = 1; next }
              /^## / { on = 0 }
              on' ../CHANGELOG.md > ../notes.md
            args=(--notes-file ../notes.md)
            if ! grep -q '[^[:space:]]' ../notes.md; then
              echo "::warning::No '## $base' section in CHANGELOG.md; using GitHub's generated notes."
              args=(--generate-notes)
            elif [ "$PRERELEASE" = true ]; then
              { echo "Release candidate of $base. Try it and report problems before $base is tagged."; echo; cat ../notes.md; } > ../notes-rc.md
              args=(--notes-file ../notes-rc.md)
            fi
            prerelease_flag=()
            [ "$PRERELEASE" = true ] && prerelease_flag=(--prerelease)
            # Draft first, published once every file is attached: a published
            # release can be immutable and refuse new files.
            # A release candidate from a branch has no tag yet: it is created on
            # that commit when the draft is published.
            if [ -n "$TARGET" ]; then tag_args=(--target "$TARGET"); else tag_args=(--verify-tag); fi
            gh release create "$TAG" --repo "$REPO" --title "Theo $TAG" "${tag_args[@]}" \
              --draft "${prerelease_flag[@]}" "${args[@]}"
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
            gh release edit "$TAG" --repo "$REPO" --draft=false
          fi
