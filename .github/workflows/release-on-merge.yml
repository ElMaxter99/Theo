name: Release on merge

# Merging a pull request from release/X.Y.Z into main tags the merge commit
# vX.Y.Z and runs the Release workflow on it, which publishes the release.
# No tag is created by hand. See CONTRIBUTING.md, "Releasing".
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: Tag the merge commit
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Create the tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          ver="${BRANCH#release/}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch '$BRANCH' is not release/X.Y.Z (digits only)."
            exit 1
          fi
          tag="v$ver"
          # gh api prints the 404 body on stdout when the tag does not exist,
          # so only keep the output of a call that succeeded.
          have=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null) || have=""
          if [ -z "$have" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="$SHA" > /dev/null
          elif [ "$have" != "$SHA" ]; then
            echo "::error::${tag} already exists on another commit (${have})."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: tag
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
